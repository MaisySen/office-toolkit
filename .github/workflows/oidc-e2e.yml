# Full identity journey against a real maintained IdP (Keycloak) with local
# mail capture (Mailpit). No external mail, no secrets, no accounts.
name: oidc-e2e
on: [push]
jobs:
  keycloak-journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start Keycloak (dev mode) and Mailpit
        run: |
          docker run -d --name keycloak --network host \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:26.8 \
            start-dev --hostname http://localhost:8080 --http-enabled true
          docker run -d --name mailpit --network host axllent/mailpit:latest
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/realms/master >/dev/null && break
            sleep 3
          done
          curl -sf http://localhost:8080/realms/master >/dev/null || { docker logs keycloak 2>&1 | tail -40; exit 1; }
          for i in $(seq 1 20); do
            curl -sf http://localhost:8025/api/v1/messages >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8025/api/v1/messages >/dev/null || { docker logs mailpit 2>&1 | tail -20; exit 1; }
          echo "keycloak and mailpit ready"
      - name: Install toolkit
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer libreoffice-calc tesseract-ocr >/dev/null
          pip install -r requirements.txt
      - name: Install Playwright chromium
        run: |
          pip install playwright
          sudo python -m playwright install-deps chromium
          python -m playwright install chromium
      - name: Run the full journey
        run: python scripts/keycloak_ci_journey.py
        env:
          KC_ADMIN: admin
          KC_ADMIN_PASSWORD: admin
