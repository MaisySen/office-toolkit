name: android-apk
on: [push]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install JS dependencies
        run: npm ci
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --non-interactive --no-install --clean
        env:
          CI: 1
      - name: Align Kotlin with the version React Native actually applies
        # RN 0.76's version catalog pins the Kotlin Gradle Plugin to
        # 1.9.24, while the prebuild template's ext default (1.9.25) only
        # drives expo-modules-core's compose-compiler map, producing a
        # 1.5.15-compiler/1.9.24-plugin mismatch. Pinning the template's
        # own property to 1.9.24 selects compose compiler 1.5.14, the
        # pairing in expo-modules-core's compatibility map.
        working-directory: mobile/android
        run: echo "android.kotlinVersion=1.9.24" >> gradle.properties
      - name: Build debug APK with the runner's preinstalled Android SDK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: office-toolkit-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
