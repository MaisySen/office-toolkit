name: ios-runtime
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    # Platform-scoped: a repair that only touches this workflow's scope
    # must not restart (or concurrency-cancel) the other platform's run.
    paths:
      - ".github/workflows/ios-runtime.yml"
      - "scripts/ci_runtime_stack.py"
      - "mobile/**"
      - "office_toolkit/**"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  runtime:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the toolkit's Python dependencies
        run: pip install -r requirements.txt
      - name: Download Keycloak and Mailpit
        run: |
          curl -sfL -o /tmp/kc.tar.gz \
            https://github.com/keycloak/keycloak/releases/download/26.8.1/keycloak-26.8.1.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /tmp
          curl -sfL -o /tmp/mailpit.tar.gz \
            https://github.com/axllent/mailpit/releases/latest/download/mailpit-darwin-arm64.tar.gz
          tar -xzf /tmp/mailpit.tar.gz -C /tmp mailpit
      - name: Start Keycloak, Mailpit and the toolkit app
        timeout-minutes: 10
        run: |
          KC_BOOTSTRAP_ADMIN_USERNAME=admin \
          KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
          /tmp/keycloak-26.8.1/bin/kc.sh start-dev --http-port 8080 \
            > /tmp/kc.log 2>&1 &
          /tmp/mailpit --listen 127.0.0.1:8025 --smtp-listen 127.0.0.1:1025 > /tmp/mailpit.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf --max-time 5 http://localhost:8080/realms/master >/dev/null && break
            sleep 2
          done
          curl -sf --max-time 5 http://localhost:8080/realms/master >/dev/null \
            || { tail -40 /tmp/kc.log; exit 1; }
          # The simulator can blackhole localhost over IPv6 (KC binds
          # 127.0.0.1 only), so every app-facing URL is the numeric IP,
          # and the minted iss must match it end to end.
          KC_BASE=http://localhost:8080           PUBLIC_ISSUER=http://127.0.0.1:8080/realms/office-toolkit             python3 scripts/ci_runtime_stack.py || { tail -60 /tmp/kc.log; exit 1; }
      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci
      - name: Build the app for the simulator
        timeout-minutes: 30
        working-directory: mobile
        env:
          CI: 1
          # expo-constants re-evaluates app.config.js during xcodebuild,
          # so the endpoints must be set here, not only at prebuild.
          TOOLKIT_OIDC_ISSUER: http://127.0.0.1:8080/realms/office-toolkit
          TOOLKIT_API_BASE_URL: http://127.0.0.1:5000
        run: |
          npx expo prebuild --platform ios --non-interactive --no-install --clean
          npx pod-install ios --non-interactive
          cd ios
          xcodebuild -workspace OfficeToolkit.xcworkspace \
            -scheme OfficeToolkit -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build
      - name: Verify and boot an installed simulator runtime
        timeout-minutes: 15
        run: |
          xcrun simctl list runtimes
          RUNTIME=$(xcrun simctl list runtimes -j \
            | jq -r '[.runtimes[] | select(.platform=="iOS" and .isAvailable)] | last | .identifier')
          test -n "$RUNTIME" && test "$RUNTIME" != null \
            || { echo "no usable iOS simulator runtime installed"; exit 1; }
          TYPE=$(xcrun simctl list devicetypes -j \
            | jq -r '[.devicetypes[] | select(.name | test("^iPhone 1[5-9]"))] | last | .identifier')
          UDID=$(xcrun simctl create ci-iphone "$TYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH=$(find mobile/ios/build -type d -name "*.app" | head -1)
          test -n "$APP_PATH" || {
            echo "no .app found under mobile/ios/build; tree:"
            find mobile/ios/build -maxdepth 5 | head -50
            exit 1
          }
          echo "installing $APP_PATH"
          xcrun simctl install booted "$APP_PATH"
      - name: Start Metro and warm the ios bundle
        timeout-minutes: 8
        working-directory: mobile
        env:
          CI: 1
          # In a dev build Constants.expoConfig comes from the manifest
          # Metro serves, evaluated with THIS shell's env.
          TOOLKIT_OIDC_ISSUER: http://127.0.0.1:8080/realms/office-toolkit
          TOOLKIT_API_BASE_URL: http://127.0.0.1:5000
        run: |
          # react-native 0.76's cli.js is a deprecation shim without the
          # start command; the Expo CLI owns Metro in this project.
          nohup npx expo start --host lan --port 8081 \
            > /tmp/metro.log 2>&1 &
          for i in $(seq 1 45); do
            curl -sf --max-time 5 http://127.0.0.1:8081/status \
              | grep -q 'packager-status:running' && break
            sleep 2
          done
          curl -sf --max-time 5 http://127.0.0.1:8081/status \
            | grep -q 'packager-status:running' \
            || { tail -40 /tmp/metro.log; exit 1; }
          # Bundle once here so the app launch does not pay the full
          # bundling cost on the UI thread while Maestro watches.
          curl -sf --max-time 300 \
            'http://127.0.0.1:8081/.expo/.virtual-metro-entry.bundle?platform=ios&dev=true&hot=false&lazy=true&minify=false&transform.engine=hermes&transform.bytecode=1&unstable_transformProfile=hermes-stable' \
            -o /dev/null || { tail -40 /tmp/metro.log; exit 1; }
      - name: Install Maestro
        run: |
          curl -sfL -o /tmp/maestro.zip \
            https://github.com/mobile-dev-inc/maestro/releases/latest/download/maestro.zip
          unzip -q -o /tmp/maestro.zip -d /tmp
          # macOS /tmp is a symlink to /private/tmp; plain find does not
          # traverse it, so follow the starting-point link with -H.
          MAESTRO_DIR=$(find -H /tmp -maxdepth 1 -type d -name 'maestro*' | head -1)
          test -x "$MAESTRO_DIR/bin/maestro" || {
            echo "maestro binary not found after unzip; /tmp contains:"
            ls -la /tmp | head -20
            exit 1
          }
          echo "$MAESTRO_DIR/bin" >> "$GITHUB_PATH"
      - name: Re-warm Keycloak after the build window
        # KC sat idle through ~40 minutes of xcodebuild on a
        # memory-pressured runner; the simulator's auth session stalled
        # on a blank page, consistent with a paged-out JVM. Warm the
        # exact routes the login flow hits before Maestro starts.
        run: |
          curl -sf --max-time 30 \
            http://127.0.0.1:8080/realms/office-toolkit/.well-known/openid-configuration \
            > /dev/null || { tail -40 /tmp/kc.log; exit 1; }
          curl -s --max-time 30 -o /dev/null -w 'authorize warm: %{http_code}\n' \
            'http://127.0.0.1:8080/realms/office-toolkit/protocol/openid-connect/auth?client_id=office-toolkit-mobile&redirect_uri=officetoolkit%3A%2F%2Fauth&response_type=code&scope=openid&code_challenge_method=S256&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM'
      - name: Drive sign-in and the operation screen
        timeout-minutes: 15
        env:
          # The XCUITest driver can take minutes to install and start on
          # a cold CI simulator; Maestro's default startup timeout is
          # too tight and fails before the app is ever launched.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
        id: flow
        run: maestro test mobile/e2e/ios-runtime.yaml
      - name: Capture Keycloak state on failure
        if: failure()
        run: |
          curl -sv --max-time 10 \
            http://127.0.0.1:8080/realms/office-toolkit/.well-known/openid-configuration \
            -o /tmp/disc-probe.json || true
          echo '--- kc.log tail ---'
          tail -100 /tmp/kc.log || true
      - name: Surface runtime evidence in the job log
        # The artifact download redirect resists in-page reads, so the
        # proof (or the failure state) also travels in the job log.
        if: always()
        run: |
          if [ "${{ steps.flow.outcome }}" != "success" ]; then
            echo '--- metro JS errors ---'
            grep -iE " ERROR |Warning: " /tmp/metro.log | tail -40 || true
            echo '--- kc.log token lines ---'
            grep -iE "TokenEndpoint|invalid|error" /tmp/kc.log | tail -20 || true
            # Whatever is actually on the simulator at failure time
            # (Safari error page, app error text) is decisive evidence.
            xcrun simctl io booted screenshot /tmp/ios-failure.png 2>/dev/null || true
          fi
          find "$HOME/.maestro/tests" -name '*.png' 2>/dev/null | sort | while read -r SHOT; do
            echo "---SHOT-BEGIN $(basename "$SHOT")---"
            base64 -i "$SHOT"
            echo "---SHOT-END---"
          done
          if [ -f /tmp/ios-failure.png ]; then
            echo '---SHOT-BEGIN simulator-failure.png---'
            base64 -i /tmp/ios-failure.png
            echo '---SHOT-END---'
          fi
      - uses: actions/upload-artifact@v4
        # always: a green run must also ship its screenshots as proof.
        if: always()
        with:
          name: ios-runtime-state
          path: |
            ~/.maestro/tests
            /tmp/kc.log
