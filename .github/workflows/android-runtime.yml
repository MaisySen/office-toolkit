# PARKED - manual trigger only until the owner approves the Android SDK
# License Agreement for the emulator + system-image components. This
# workflow NEVER runs `sdkmanager --licenses` (the blanket accept): it
# installs exactly five stable components and fails loudly if any
# license other than android-sdk-license is accepted or requested.
name: android-runtime
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install JS dependencies
        run: npm ci
      - name: Generate the native Android project (emulator endpoints)
        run: npx expo prebuild --platform android --non-interactive --no-install --clean
        env:
          CI: 1
          TOOLKIT_OIDC_ISSUER: http://10.0.2.2:8080/realms/office-toolkit
          TOOLKIT_API_BASE_URL: http://10.0.2.2:5000
      - name: Align Kotlin with the version React Native actually applies
        working-directory: mobile/android
        run: echo "android.kotlinVersion=1.9.24" >> gradle.properties
      - name: Build debug APK with the runner's preinstalled Android SDK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: office-toolkit-runtime-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
  runtime:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the toolkit's Python dependencies
        run: pip install -r requirements.txt
      - name: Download Keycloak, Mailpit and Maestro
        run: |
          curl -sL -o /tmp/kc.tar.gz \
            https://github.com/keycloak/keycloak/releases/download/26.8.1/keycloak-26.8.1.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /tmp
          curl -sL -o /tmp/mailpit.zip \
            https://github.com/axllent/mailpit/releases/latest/download/mailpit-linux-amd64.zip
          unzip -q -o /tmp/mailpit.zip -d /tmp mailpit
          curl -sL -o /tmp/maestro.zip \
            https://github.com/mobile-dev-inc/maestro/releases/latest/download/maestro.zip
          unzip -q -o /tmp/maestro.zip -d /tmp
          echo "$(find /tmp -maxdepth 1 -type d -name 'maestro*' | head -1)/bin" >> "$GITHUB_PATH"
      - name: Install ONLY the stable emulator components (scoped license acceptance)
        # Scoped by construction: sdkmanager prompts only for licenses
        # attached to the packages being installed, and all five packages
        # are stable-channel and carry only the Android SDK License
        # Agreement (Google repository metadata, repository2-3.xml). The
        # blanket `--licenses` command is never invoked. The job fails if
        # anything preview-flavoured appears or if any other license file
        # lands in the SDK licenses directory.
        run: |
          BEFORE=$(ls "$ANDROID_HOME/licenses" 2>/dev/null | sort | tr '\n' ' ')
          echo "licenses before: ${BEFORE:-none}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'build-tools;37.0.0' platform-tools 'platforms;android-34' \
            emulator 'system-images;android-34;google_apis;x86_64' 2>&1 \
            | tee /tmp/sdk-install.log
          ! grep -qi "preview" /tmp/sdk-install.log \
            || { echo "preview component/license detected - refusing"; exit 1; }
          AFTER=$(ls "$ANDROID_HOME/licenses" | sort | tr '\n' ' ')
          echo "licenses after: $AFTER"
          for f in $AFTER; do
            case " $BEFORE " in
              *" $f "*) ;;
              *) test "$f" = "android-sdk-license" \
                 || { echo "unexpected license accepted: $f"; exit 1; } ;;
            esac
          done
      - name: Start Keycloak, Mailpit and the toolkit app
        run: |
          echo "127.0.0.1 10.0.2.2" | sudo tee -a /etc/hosts
          /tmp/keycloak-26.8.1/bin/kc.sh start-dev --http-port 8080 \
            --hostname http://10.0.2.2:8080 --hostname-strict false \
            > /tmp/kc.log 2>&1 &
          /tmp/mailpit --listen 127.0.0.1:8025 --smtp-listen 127.0.0.1:1025 > /tmp/mailpit.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/realms/master >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8080/realms/master >/dev/null \
            || { tail -40 /tmp/kc.log; exit 1; }
          KC_BASE=http://localhost:8080 \
          PUBLIC_ISSUER=http://10.0.2.2:8080/realms/office-toolkit \
            python3 scripts/ci_runtime_stack.py
      - name: Boot the emulator and install the APK
        run: |
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n ci \
            -k 'system-images;android-34;google_apis;x86_64' --force
          "$ANDROID_HOME/emulator/emulator" -avd ci -no-window \
            -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim &
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          "$ANDROID_HOME/platform-tools/adb" shell 'while [ -z "$(getprop sys.boot_completed)" ]; do sleep 2; done'
      - uses: actions/download-artifact@v4
        with:
          name: office-toolkit-runtime-apk
          path: /tmp/apk
      - name: Install the app and drive sign-in
        run: |
          "$ANDROID_HOME/platform-tools/adb" install -r /tmp/apk/app-debug.apk
          maestro test mobile/e2e/android-runtime.yaml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-runtime-failure-state
          path: ~/.maestro/tests
