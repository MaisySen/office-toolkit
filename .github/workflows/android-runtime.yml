# SDK license gate. scripts/ci_android_license.py validates Google's
# live repository metadata BEFORE any acceptance: all five components
# below must be stable-channel and carry only android-sdk-license, and
# the license text hash must equal the pin recorded in the script. Any
# drift refuses the job before sdkmanager runs. The install seeds only
# that license file and runs with stdin closed, so an unexpected prompt
# fails the job instead of ever being accepted. The blanket
# `--licenses` command is never invoked.
name: android-runtime
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    # Platform-scoped: a repair that only touches this workflow's scope
    # must not restart (or concurrency-cancel) the other platform's run.
    paths:
      - ".github/workflows/android-runtime.yml"
      - "scripts/ci_android_license.py"
      - "scripts/ci_runtime_stack.py"
      - "mobile/**"
      - "office_toolkit/**"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install JS dependencies
        run: npm ci
      - name: Generate the native Android project (emulator endpoints)
        run: npx expo prebuild --platform android --non-interactive --no-install --clean
        env:
          CI: 1
          TOOLKIT_OIDC_ISSUER: http://10.0.2.2:8080/realms/office-toolkit
          TOOLKIT_API_BASE_URL: http://10.0.2.2:5000
      - name: Align Kotlin with the version React Native actually applies
        working-directory: mobile/android
        run: echo "android.kotlinVersion=1.9.24" >> gradle.properties
      - name: Build debug APK with the runner's preinstalled Android SDK
        working-directory: mobile/android
        # expo-constants' createExpoConfig gradle task re-evaluates
        # app.config.js at BUILD time and bundles assets/app.config into
        # the APK; without these the embedded endpoints fall back to
        # app.json's localhost defaults (evidenced by scanning the APK).
        env:
          TOOLKIT_OIDC_ISSUER: http://10.0.2.2:8080/realms/office-toolkit
          TOOLKIT_API_BASE_URL: http://10.0.2.2:5000
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: office-toolkit-runtime-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
  runtime:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the toolkit's Python dependencies
        run: pip install -r requirements.txt
      - name: Download Keycloak, Mailpit and Maestro
        run: |
          curl -sfL -o /tmp/kc.tar.gz \
            https://github.com/keycloak/keycloak/releases/download/26.8.1/keycloak-26.8.1.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /tmp
          curl -sfL -o /tmp/mailpit.tar.gz \
            https://github.com/axllent/mailpit/releases/latest/download/mailpit-linux-amd64.tar.gz
          tar -xzf /tmp/mailpit.tar.gz -C /tmp mailpit
          curl -sfL -o /tmp/maestro.zip \
            https://github.com/mobile-dev-inc/maestro/releases/latest/download/maestro.zip
          unzip -q -o /tmp/maestro.zip -d /tmp
          echo "$(find /tmp -maxdepth 1 -type d -name 'maestro*' | head -1)/bin" >> "$GITHUB_PATH"
      - name: Gate SDK components and license text BEFORE any acceptance
        # Refuses (exit 1) before sdkmanager runs if any of the five
        # components left the stable channel, carries any license other
        # than android-sdk-license, or if the license text hash no
        # longer equals the approved pin recorded in the script.
        run: |
          python3 scripts/ci_android_license.py \
            --write-license-file "$ANDROID_HOME/licenses/android-sdk-license" \
            'build-tools;37.0.0' platform-tools 'platforms;android-34' \
            emulator 'system-images;android-34;google_apis;x86_64'
      - name: Install the five components (stdin closed)
        # sdkmanager never sees an acceptance answer: the gate step
        # pre-recorded the validated license by the exact hash sdkmanager
        # computes, and stdin is closed so any unexpected prompt fails on
        # EOF instead of being accepted. The post-check asserts that no
        # license file other than the seeded one appears.
        run: |
          ls "$ANDROID_HOME/licenses" | sort > /tmp/licenses.before
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'build-tools;37.0.0' platform-tools 'platforms;android-34' \
            emulator 'system-images;android-34;google_apis;x86_64' \
            < /dev/null 2>&1 | tee /tmp/sdk-install.log
          ls "$ANDROID_HOME/licenses" | sort > /tmp/licenses.after
          # Only NEWLY created license files may appear, and the only
          # permitted new one is android-sdk-license itself. Runner
          # images may ship other preexisting license files; those are
          # not ours to judge and are ignored.
          NEW=$(comm -13 /tmp/licenses.before /tmp/licenses.after)
          for f in $NEW; do
            test "$f" = "android-sdk-license" \
              || { echo "unexpected license accepted: $f"; exit 1; }
          done
      - name: Start Keycloak, Mailpit and the toolkit app
        timeout-minutes: 10
        run: |
          # 10.0.2.2 is a numeric IP: /etc/hosts only maps NAMES, so a
          # hosts entry can never make it local. Bind it to loopback
          # instead, so runner-side tooling (issuer check, the toolkit
          # app's OIDC discovery) can use the exact URL the emulator app
          # will use, and KC derives the same issuer from the request
          # host either way.
          sudo ip addr add 10.0.2.2/32 dev lo || true
          # start-dev binds 127.0.0.1 only; the emulator-facing issuer is
          # 10.0.2.2 (bound to lo above), so KC must listen on every
          # interface for runner-side and emulator-side requests to agree.
          # Keep comment lines out of the env-var continuation block below.
          KC_BOOTSTRAP_ADMIN_USERNAME=admin \
          KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
          /tmp/keycloak-26.8.1/bin/kc.sh start-dev --http-port 8080 \
            --http-host 0.0.0.0 > /tmp/kc.log 2>&1 &
          /tmp/mailpit --listen 127.0.0.1:8025 --smtp-listen 127.0.0.1:1025 > /tmp/mailpit.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf --max-time 5 http://localhost:8080/realms/master >/dev/null && break
            sleep 2
          done
          curl -sf --max-time 5 http://localhost:8080/realms/master >/dev/null \
            || { tail -40 /tmp/kc.log; exit 1; }
          # Fail in seconds, not after grant retries, if the bootstrap admin
          # was never created (for example a broken env-var prefix above).
          grep -q 'Created temporary admin user' /tmp/kc.log || {
            echo 'bootstrap admin user missing from kc.log'
            tail -40 /tmp/kc.log
            exit 1
          }
          KC_BASE=http://localhost:8080 \
          PUBLIC_ISSUER=http://10.0.2.2:8080/realms/office-toolkit \
            python3 scripts/ci_runtime_stack.py \
            || { tail -60 /tmp/kc.log; exit 1; }
      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci
      - name: Start Metro and warm the android bundle
        timeout-minutes: 8
        working-directory: mobile
        env:
          CI: 1
        run: |
          # react-native 0.76's cli.js is a deprecation shim without the
          # start command; the Expo CLI owns Metro in this project.
          # The debug app takes Constants.expoConfig from the manifest
          # Metro serves, and Metro evaluates app.config.js with ITS own
          # environment - without these the app falls back to app.json's
          # localhost issuer and the auth tab opens localhost:8080, which
          # the emulator cannot reach (evidenced: ERR_CONNECTION_REFUSED).
          TOOLKIT_OIDC_ISSUER=http://10.0.2.2:8080/realms/office-toolkit \
          TOOLKIT_API_BASE_URL=http://10.0.2.2:5000 \
          nohup npx expo start --host lan --port 8081 \
            > /tmp/metro.log 2>&1 &
          for i in $(seq 1 45); do
            curl -sf --max-time 5 http://127.0.0.1:8081/status \
              | grep -q 'packager-status:running' && break
            sleep 2
          done
          curl -sf --max-time 5 http://127.0.0.1:8081/status \
            | grep -q 'packager-status:running' \
            || { tail -40 /tmp/metro.log; exit 1; }
          # Bundle once here so the app launch does not pay the full
          # bundling cost on the UI thread while Maestro watches.
          curl -sf --max-time 300 \
            'http://127.0.0.1:8081/.expo/.virtual-metro-entry.bundle?platform=android&dev=true&hot=false&lazy=true&minify=false&transform.engine=hermes&transform.bytecode=1&unstable_transformProfile=hermes-stable' \
            -o /dev/null || { tail -40 /tmp/metro.log; exit 1; }
      - name: Boot the emulator and install the APK
        timeout-minutes: 15
        run: |
          # avdmanager on current cmdline-tools exits 0 without creating
          # anything (with or without --device, with or without the
          # hardware-profile prompt), so write the AVD definition files
          # directly; the emulator only needs these two files to boot.
          test -d "$ANDROID_HOME/system-images/android-34/google_apis/x86_64" || {
            echo 'android-34 google_apis x86_64 system image is missing:'
            ls "$ANDROID_HOME/system-images" 2>/dev/null || true
            exit 1
          }
          mkdir -p "$HOME/.android/avd/ci.avd"
          cat > "$HOME/.android/avd/ci.ini" <<AVDEOF
          avd.ini.encoding=UTF-8
          path=$HOME/.android/avd/ci.avd
          path.rel=avd/ci.avd
          target=android-34
          AVDEOF
          cat > "$HOME/.android/avd/ci.avd/config.ini" <<CFGEOF
          AvdId=ci
          PlayStore.enabled=false
          abi.type=x86_64
          avd.ini.displayname=ci
          avd.ini.encoding=UTF-8
          disk.dataPartition.size=4G
          hw.cpu.arch=x86_64
          hw.keyboard=yes
          hw.ramSize=2048
          image.sysdir.1=system-images/android-34/google_apis/x86_64/
          tag.display=Google APIs
          tag.id=google_apis
          CFGEOF
          # /dev/kvm exists but the runner user is not in the kvm group;
          # a group change needs a new login, so open the device instead.
          test -w /dev/kvm || sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd ci -no-window -no-metrics \
            -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim &
          timeout 420 "$ANDROID_HOME/platform-tools/adb" wait-for-device \
            || { echo 'emulator never appeared on adb'; exit 1; }
          timeout 420 "$ANDROID_HOME/platform-tools/adb" \
            shell 'while [ -z "$(getprop sys.boot_completed)" ]; do sleep 2; done' \
            || { echo 'emulator boot never completed'; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: office-toolkit-runtime-apk
          path: /tmp/apk
      - name: Install the app and drive sign-in
        id: flow
        timeout-minutes: 15
        run: |
          "$ANDROID_HOME/platform-tools/adb" install -r /tmp/apk/app-debug.apk
          # Seed the input the flow picks through the system document
          # picker. adb push skips MediaStore, so the flow navigates to
          # the Downloads root instead of relying on Recent.
          python3 -c "from reportlab.pdfgen import canvas; c = canvas.Canvas('/tmp/runtime-sample.pdf'); c.drawString(72, 720, 'runtime proof page'); c.save()"
          "$ANDROID_HOME/platform-tools/adb" push /tmp/runtime-sample.pdf /sdcard/Download/runtime-sample.pdf
          maestro test mobile/e2e/android-runtime.yaml
      - name: Inspect the operation output file
        # The app writes the server result into its files directory.
        # PDF to JPEG returns a ZIP of JPEG pages (pages-jpeg.zip);
        # pull it and verify every contained page decodes as a real
        # JPEG. A bare JPEG output is accepted too.
        if: success()
        run: |
          "$ANDROID_HOME/platform-tools/adb" root || true
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          OUT=$("$ANDROID_HOME/platform-tools/adb" shell 'ls -t /data/data/au.fintex.officetoolkit/files/ | grep -E "^pages-jpeg.*[.]zip$" | head -1' | tr -d '\r')
          test -n "$OUT" || {
            echo 'no pages-jpeg output found; files dir holds:'
            "$ANDROID_HOME/platform-tools/adb" shell 'ls /data/data/au.fintex.officetoolkit/files/'
            exit 1
          }
          "$ANDROID_HOME/platform-tools/adb" pull "/data/data/au.fintex.officetoolkit/files/$OUT" /tmp/op-output
          python3 - <<'PYEOF'
          import io, zipfile
          from PIL import Image
          data = open('/tmp/op-output', 'rb').read()
          if data[:4] == b'PK\x03\x04':
              z = zipfile.ZipFile(io.BytesIO(data))
              pages = [n for n in z.namelist() if n.lower().endswith(('.jpg', '.jpeg'))]
              assert pages, f'no JPEG pages in zip: {z.namelist()}'
              for n in pages:
                  d = z.read(n)
                  assert d[:2] == b'\xff\xd8', f'{n} is not a JPEG'
                  Image.open(io.BytesIO(d)).verify()
              print(f'output OK: zip with {len(pages)} decodable JPEG page(s), {len(data)} bytes')
              # Emit each page into the job log so the actual rendered
              # page can be visually inspected, not only decoded.
              import base64, sys
              for n in pages:
                  sys.stdout.write(f'---PAGE-BEGIN {n}---\n')
                  sys.stdout.write(base64.b64encode(z.read(n)).decode() + '\n')
                  sys.stdout.write('---PAGE-END---\n')
          else:
              assert data[:2] == b'\xff\xd8', f'not a JPEG or ZIP: {data[:16]!r}'
              Image.open(io.BytesIO(data)).verify()
              print(f'output OK: {len(data)} bytes, decodable JPEG')
          PYEOF
      - name: Surface runtime evidence in the job log
        # The artifact download redirect resists in-page reads, so the
        # proof (or the failure state) also travels in the job log.
        if: always()
        run: |
          if [ "${{ steps.flow.outcome }}" != "success" ]; then
            echo '--- logcat (ReactNativeJS and crashes) ---'
            "$ANDROID_HOME/platform-tools/adb" logcat -d -t 6000 2>/dev/null | grep -iE "ReactNativeJS|AndroidRuntime|FATAL EXCEPTION" | tail -50 || true
            echo '--- app files and picker cache ---'
            "$ANDROID_HOME/platform-tools/adb" root >/dev/null 2>&1 || true
            "$ANDROID_HOME/platform-tools/adb" shell 'ls -la /data/data/au.fintex.officetoolkit/files/ 2>/dev/null; ls -la /data/data/au.fintex.officetoolkit/cache/ 2>/dev/null | head -8' || true
          fi
          find "$HOME/.maestro/tests" -name '*.png' 2>/dev/null | sort | while read -r SHOT; do
            echo "---SHOT-BEGIN $(basename "$SHOT")---"
            base64 -w0 "$SHOT"
            echo
            echo "---SHOT-END---"
          done
      - uses: actions/upload-artifact@v4
        # always: a green run must also ship its screenshots as proof.
        if: always()
        with:
          name: android-runtime-state
          path: ~/.maestro/tests
