appId: au.fintex.officetoolkit
---
# Real sign-in against the live Keycloak on the runner (via the
# emulator's host alias 10.0.2.2) in a Chrome Custom Tab, then the
# authenticated operation screen.
- launchApp:
    clearState: true
- assertVisible: "Sign in"
- takeScreenshot: sign-in-screen
- tapOn: "Sign in"
# A cold emulator can route the first custom-tab hand-off through
# Chrome's first-run welcome; the optional tap waits out Maestro's 7s
# optional lookup and skips cleanly once Chrome is warm, and Chrome
# continues to the pending login URL after the dismissal.
- tapOn:
    text: "Use without an account"
    optional: true
- extendedWaitUntil:
    visible: "Username or email"
    timeout: 45000
- tapOn: "Username or email"
- inputText: "runtime.user@example.com"
- tapOn: "Password"
- inputText: "runtime-pass-123"
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "PDF to JPEG"
    timeout: 60000
- assertVisible: "PDF to JPEG"
- takeScreenshot: operation-screen
- tapOn: "PDF to JPEG"
- assertVisible: "Choose file and run"
- takeScreenshot: operation-ready
