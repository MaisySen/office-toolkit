appId: au.fintex.officetoolkit
---
# Real sign-in against the live Keycloak on the runner (via the
# emulator's host alias 10.0.2.2) in a Chrome Custom Tab, then the
# authenticated operation screen.
- launchApp:
    clearState: true
- assertVisible: "Sign in"
- takeScreenshot: sign-in-screen
- tapOn: "Sign in"
# A fresh emulator lands on Chrome's first-run welcome the first time
# the auth session hands Chrome the login URL (google_apis user builds
# ignore the chrome-command-line flag file). Dismiss it, drop back to
# the app, and re-trigger sign-in; absent on any warmed emulator.
- runFlow:
    when:
      visible: "Use without an account"
    commands:
      - tapOn: "Use without an account"
      - back
      - tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Username or email"
    timeout: 30000
- tapOn: "Username or email"
- inputText: "runtime.user@example.com"
- tapOn: "Password"
- inputText: "runtime-pass-123"
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "PDF to JPEG"
    timeout: 60000
- assertVisible: "PDF to JPEG"
- takeScreenshot: operation-screen
- tapOn: "PDF to JPEG"
- assertVisible: "Choose file and run"
- takeScreenshot: operation-ready
