appId: au.fintex.officetoolkit
---
# Real sign-in against the live Keycloak on the runner (via the
# emulator's host alias 10.0.2.2) in a Chrome Custom Tab, then the
# authenticated operation screen.
- launchApp:
    clearState: true
- assertVisible: "Sign in"
- takeScreenshot: sign-in-screen
- tapOn: "Sign in"
# A cold emulator can route the first custom-tab hand-off through
# Chrome's first-run welcome; the optional tap waits out Maestro's 7s
# optional lookup and skips cleanly once Chrome is warm, and Chrome
# continues to the pending login URL after the dismissal.
- tapOn:
    text: "Use without an account"
    optional: true
- extendedWaitUntil:
    visible: "Username or email"
    timeout: 45000
- tapOn: "Username or email"
- inputText: "runtime.user@example.com"
# With the keyboard open, the password label tap does not move focus
# (the input went into the username field) and the Sign In button sits
# under the keyboard. Close it between fields so each tap lands on a
# stable, visible target.
- hideKeyboard
- tapOn: "Password"
- inputText: "runtime-pass-123"
- hideKeyboard
# The realm header pushes the button below the fold on small screens;
# text lookup fails until it is scrolled into view.
- scrollUntilVisible:
    element:
      text: "Sign In"
    direction: DOWN
    timeout: 30000
- tapOn: "Sign In"
# Wait for the list itself, then scroll: the operation sits below the
# fold in the FlatList, so a bare visible-wait never fires.
- extendedWaitUntil:
    visible: "Merge PDFs"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "PDF to JPEG"
    direction: DOWN
    timeout: 30000
- assertVisible: "PDF to JPEG"
- takeScreenshot: operation-screen
- tapOn: "PDF to JPEG"
- assertVisible: "Choose file and run"
- takeScreenshot: operation-ready
- tapOn: "Choose file and run"
# The system picker opens on Recent, but adb-pushed files are not in
# MediaStore; go through the Downloads root instead.
- extendedWaitUntil:
    visible: "Show roots"
    timeout: 30000
- takeScreenshot: picker-open
- tapOn: "Show roots"
- extendedWaitUntil:
    visible: "Downloads"
    timeout: 15000
- tapOn: "Downloads"
- extendedWaitUntil:
    visible: "runtime-sample.pdf"
    timeout: 15000
- takeScreenshot: picker-downloads
- tapOn: "runtime-sample.pdf"
# The app runs the operation server-side, writes the result ZIP and
# shows its own result line with a Share button. The system chooser
# is not exposed to Maestro's hierarchy (proven: "Sharing 1 file" was
# on screen while the text lookup failed), so read the app's result
# line, then exercise Share and dismiss the sheet without asserting
# system text.
- extendedWaitUntil:
    visible: "Done:"
    timeout: 120000
- takeScreenshot: operation-result
- tapOn: "Share"
- back
- assertVisible: "Done:"
