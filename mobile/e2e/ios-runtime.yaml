appId: au.fintex.officetoolkit
---
# Real sign-in against the live Keycloak on the runner, then the
# authenticated operation screen. The system file picker leg is added
# once its seeding route is proven; the API-level operation proof lives
# in the Keycloak journey.
- launchApp:
    clearState: true
# A cold Metro cache leaves the debug build at "Bundling 99%" past the
# default assert timeout; give the first screen a long, explicit wait.
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 120000
- takeScreenshot: sign-in-screen
- tapOn: "Sign in"
# iOS shows the "Wants to Use localhost to Sign In" consent sheet on
# every fresh-install auth prompt; the conditional check raced the
# sheet before, so wait for it deterministically.
# The sheet took ~22s to present on a post-build runner once; it beat
# a 20s wait by two seconds and the failure screenshot caught it.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 60000
- tapOn: "Continue"
# A paged-out Keycloak can need well over 30s for its first page.
- extendedWaitUntil:
    visible: "Username or email"
    timeout: 90000
- tapOn: "Username or email"
- inputText: "runtime.user@example.com"
# Same keyboard-covers-form fix as the Android flow, but simulators
# with a hardware keyboard show nothing to hide, so tolerate that.
- hideKeyboard:
    optional: true
- tapOn: "Password"
- inputText: "runtime-pass-123"
- hideKeyboard:
    optional: true
# The realm header pushes the button below the fold on small screens;
# text lookup fails until it is scrolled into view.
- scrollUntilVisible:
    element:
      text: "Sign In"
    direction: DOWN
    timeout: 30000
- tapOn: "Sign In"
# Freeze whatever is on screen right after the tap (Safari hand-off,
# Keycloak error page, or the app) for the failure picture.
- takeScreenshot: after-signin
# Back in the app, the authenticated operation list comes from the live
# API over the bearer token the session just minted.
# Wait for the list itself, then scroll: the operation sits below the
# fold in the FlatList, so a bare visible-wait never fires.
- extendedWaitUntil:
    visible: "Merge PDFs"
    timeout: 120000
- scrollUntilVisible:
    element:
      text: "PDF to JPEG"
    direction: DOWN
    timeout: 30000
- assertVisible: "PDF to JPEG"
- takeScreenshot: operation-screen
- tapOn: "PDF to JPEG"
- assertVisible: "Choose file and run"
- takeScreenshot: operation-ready
- tapOn: "Choose file and run"
# The sample was placed in the On My iPhone provider storage by the
# workflow. On the current runner image (iOS 26) the system document
# picker opens on its Recents tab (empty on a fresh simulator, see the
# simulator-failure screenshot of run 40965974887), so switch to the
# Browse tab first, then open On My iPhone unless Browse already shows
# the sample.
- extendedWaitUntil:
    visible: "Browse"
    timeout: 30000
- takeScreenshot: picker-open
- tapOn: "Browse"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible: "runtime-sample.pdf"
    commands:
      - extendedWaitUntil:
          visible: "On My iPhone"
          timeout: 15000
      - tapOn: "On My iPhone"
- extendedWaitUntil:
    visible: "runtime-sample.pdf"
    timeout: 15000
- takeScreenshot: picker-files
- tapOn: "runtime-sample.pdf"
# The app runs the operation server-side, writes the result ZIP and
# shows its own result line with a Share button. Maestro matches text
# as a full regular expression, so the pattern covers the file name.
- extendedWaitUntil:
    visible: "Done: .+"
    timeout: 120000
- takeScreenshot: operation-result
