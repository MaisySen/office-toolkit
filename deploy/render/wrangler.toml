name = "doctool-proxy"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "doctool.multies.si", custom_domain = true }]

[vars]
ORIGIN = "https://multies-doctool.onrender.com"

[triggers]
# Every 10 minutes keeps the free host awake (one service fits the
# 750 free instance hours a month).
crons = ["*/10 * * * *"]
